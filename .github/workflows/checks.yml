name: Checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Service and concurrency suite (SQLite model)
        run: php tests/run.php
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --check public/js/editcontrol-presence.js
      - run: python3 tools/package.py
      - run: python3 tools/validate-release.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python3 tools/prepare-editor-fixture.py
      - name: Browser regressions with real TinyMCE
        run: |
          python3 tests/preview.py &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do curl -fsS http://127.0.0.1:18769/tests/fixtures/bar.html >/dev/null && break || sleep 1; done
          cli() { npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci "$@"; }
          cli open http://127.0.0.1:18769/tests/fixtures/bar.html --browser chrome
          for suite in ui-checks ui-handoff ui-takeover ui-regressions ui-free-recovery ui-task-save; do
            cli run-code --filename "tests/$suite.js" > "$suite.log" 2>&1
            cat "$suite.log"
            if grep -q '^### Error' "$suite.log"; then exit 1; fi
          done
          cli close
